services:

  postgres:
    image: postgres:15
    container_name: swiftroute-postgres
    environment:
      POSTGRES_DB: swiftroute
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: swiftpass123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/schema.sql # Auto-initializes on first run

  redis:
    image: redis:7-alpine
    container_name: swiftroute-redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  mongodb:
    image: mongo:6
    container_name: swiftroute-mongodb
    environment:
      MONGO_INITDB_DATABASE: swiftroute_tracking
    ports:
      - "27017:27017"
    volumes:
      - mongo_data:/data/db

  zookeeper:
    image: confluentinc/cp-zookeeper:7.4.0
    container_name: swiftroute-zookeeper
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000

  kafka:
    image: confluentinc/cp-kafka:7.4.0
    container_name: swiftroute-kafka
    depends_on:
      - zookeeper
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    ports:
      - "9092:9092"

  minio:
    image: minio/minio
    container_name: swiftroute-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: swiftroute
      MINIO_ROOT_PASSWORD: swiftroute123
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  # AI ML Service for Address Search & EDD Prediction
  ai-embedder:
    build:
      context: ./src/integrations/vectors
      dockerfile: Dockerfile
    container_name: swiftroute-ai-embedder
    ports:
      - "5001:5001"
    environment:
      - PORT=5001
    restart: always

  # Sidecar to auto-create Kafka Topics and verify connectivity
  setup-infra:
    image: node:20-alpine
    container_name: swiftroute-setup-infra
    working_dir: /app
    volumes:
      - .:/app
    depends_on:
      - kafka
      - postgres
      - redis
    command: >
      sh -c "npm install ts-node typescript -g &&
      npm install &&
      npx ts-node scripts/init-infra.ts"
    environment:
      - KAFKA_BROKERS=kafka:29092
      - DATABASE_URL=postgresql://postgres:swiftpass123@postgres:5432/swiftroute
      - REDIS_URL=redis://redis:6379
      - MONGODB_URL=mongodb://mongodb:27017/swiftroute_tracking
      - ENABLE_KAFKA_CONSUMER=false

  nginx:
    image: nginx:alpine
    container_name: swiftroute-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - setup-infra

volumes:
  postgres_data:
  redis_data:
  mongo_data:
  minio_data:
